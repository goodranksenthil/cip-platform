# One command: docker compose up --build   →  http://localhost:5173
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip_password
      POSTGRES_DB: cip_db
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip -d cip_db"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      CIP_DATABASE_URL: postgresql+psycopg://cip:cip_password@db:5432/cip_db
      CIP_FIELD_ENCRYPTION_KEY: local-dev-only-rotate-me-0123456789
      CIP_BLOB_ROOT: /data/blob
    volumes: [blob:/data/blob]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  blob:
