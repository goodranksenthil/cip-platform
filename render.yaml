# Render Blueprint — FastAPI backend (API + outbox relay/consumer workers in one service).
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for once.
# Database: Render Postgres (free plan expires after 30 days; upgrade or switch to Supabase).
# File storage: Supabase Storage. See docs/DEPLOY.md.
databases:
  - name: cip-db
    plan: free
    region: singapore
    databaseName: cip_db
    user: cip
    postgresMajorVersion: "16"
    ipAllowList: []            # no public access; only Render services in this workspace connect

services:
  - type: web
    name: cip-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]   # frontend-only commits don't redeploy the API
    region: singapore          # keep close to the Supabase project region
    plan: free                 # no card needed; sleeps after 15 min idle (pauses workers). Use starter for always-on.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CIP_ENVIRONMENT
        value: cloud
      # Render-managed Postgres (below), wired in automatically — no password is typed anywhere.
      # To use Supabase Postgres instead, replace this with `sync: false` and paste the
      # Supabase "Session pooler" URI (see docs/DEPLOY.md).
      - key: CIP_DATABASE_URL
        fromDatabase:
          name: cip-db
          property: connectionString
      - key: CIP_DB_POOL_SIZE
        value: "5"
      - key: CIP_DB_MAX_OVERFLOW
        value: "5"
      # At least 32 random characters. Losing it makes encrypted PHI unreadable — store it safely.
      - key: CIP_FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: CIP_STORAGE_BACKEND
        value: supabase
      - key: CIP_SUPABASE_URL
        sync: false
      - key: CIP_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CIP_SUPABASE_BUCKET
        value: cip-documents
      # JSON list of the Vercel production URL(s), e.g. ["https://cip-console.vercel.app"]
      - key: CIP_CORS_ORIGINS
        sync: false
      # Optional, for Vercel preview deployments, e.g. ^https://cip-console-[a-z0-9-]+\.vercel\.app$
      - key: CIP_CORS_ORIGIN_REGEX
        sync: false
      - key: CIP_SEED_DEMO_DATA
        value: "true"             # synthetic demo cases only; set false before any real data
      - key: CIP_WORKERS_ENABLED
        value: "true"
